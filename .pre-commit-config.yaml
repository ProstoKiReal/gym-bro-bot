repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Check Ruff formatting
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: Check with Ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: bandit
        name: Check security with Bandit
        entry: uv run bandit -q
        language: system
        types: [python]
      - id: mypy
        name: Check types with mypy
        entry: uv run mypy
        language: system
        types: [python]
